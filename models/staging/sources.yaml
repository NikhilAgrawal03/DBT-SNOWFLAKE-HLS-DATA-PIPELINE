version: 2

sources:
  - name: raw
    description: "Raw healthcare data loaded from external systems"
    database: HC_DEMO_DB
    schema: RAW_HEALTHCARE
    # Source freshness checks
    tables:
      - name: members
        description: "Member demographics and enrollment information"
        columns:
          - name: member_id
            description: "Unique member identifier (Primary Key)"
            tests:
              - unique
              - not_null

          - name: date_of_birth
            description: "Member date of birth"
            tests:
              - not_null

          - name: enrollment_date
            description: "Date member enrolled in plan"
            tests:
              - not_null

          - name: member_status
            description: "Current member status"
            tests:
              - accepted_values:
                  arguments:
                    values: ['Active', 'Inactive', 'Terminated', 'Suspended']
      - name: providers
        description: "Provider master data (loaded via dbt seed)"
        columns:
          - name: provider_id
            description: "Unique provider identifier (Primary Key)"
            tests:
              - unique
              - not_null

          - name: npi
            description: "National Provider Identifier"
            tests:
              - unique:
                  config:
                    where: "npi is not null"
          - name: specialty
            description: "Provider specialty"
            tests:
              - not_null

      - name: claims
        description: "Medical and pharmacy claims transactions"
        columns:
          - name: claim_id
            description: "Unique claim identifier (Primary Key)"
            tests:
              - unique
              - not_null

          - name: member_id
            description: "Foreign key to members"
            tests:
              - not_null
              - relationships:
                  config:
                    where: "claim_status != 'Denied'"
                  arguments:
                    to: source('raw', 'members')
                    field: member_id
          - name: provider_id
            description: "Foreign key to providers"
            tests:
              - relationships:
                  config:
                    severity: warn
                  arguments:
                    to: source('raw', 'providers')
                    field: provider_id
          - name: service_date
            description: "Date service was provided"
            tests:
              - not_null

          - name: claim_status
            description: "Current claim status"
            tests:
              - accepted_values:
                  arguments:
                    values: ['Submitted', 'Pending', 'Paid', 'Denied', 'Appealed']
          - name: billed_amount
            description: "Amount billed by provider"
            tests:
              - not_null
              - dbt_utils.expression_is_true:
                  arguments:
                    expression: ">= 0"
          - name: paid_amount
            description: "Amount paid to provider"
            tests:
              - dbt_utils.expression_is_true:
                  arguments:
                    expression: ">= 0 and paid_amount <= allowed_amount"
        config:
          freshness:
            warn_after: {count: 6, period: hour}
            error_after: {count: 12, period: hour}
          loaded_at_field: loaded_at
      - name: member_eligibility
        description: "Member plan eligibility and enrollment history"
        columns:
          - name: eligibility_id
            description: "Unique eligibility record identifier (Primary Key)"
            tests:
              - unique
              - not_null

          - name: member_id
            description: "Foreign key to members"
            tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('raw', 'members')
                    field: member_id
          - name: plan_id
            description: "Plan identifier"
            tests:
              - not_null

          - name: coverage_start_date
            description: "Coverage effective date"
            tests:
              - not_null

          - name: premium_amount
            description: "Monthly premium amount"
            tests:
              - dbt_utils.expression_is_true:
                  arguments:
                    expression: ">= 0"
        config:
          freshness:
            warn_after: {count: 24, period: hour}
          loaded_at_field: updated_at
      - name: provider_network_status
        description: "Provider network participation status and contract rates"
        columns:
          - name: network_status_id
            description: "Unique network status record identifier (Primary Key)"
            tests:
              - unique
              - not_null

          - name: provider_id
            description: "Foreign key to providers"
            tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('raw', 'providers')
                    field: provider_id
          - name: network_status
            description: "Network participation status"
            tests:
              - accepted_values:
                  arguments:
                    values: ['In-Network', 'Out-of-Network', 'Pending']
          - name: effective_date
            description: "Date network status became effective"
            tests:
              - not_null
        config:
          freshness:
            warn_after: {count: 24, period: hour}
          loaded_at_field: updated_at
    config:
      freshness:
        warn_after: {count: 24, period: day}
        error_after: {count: 48, period: day}
      loaded_at_field: loaded_at