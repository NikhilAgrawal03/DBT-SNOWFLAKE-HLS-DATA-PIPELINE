name: 'dbt_healthcare_analytics'
version: '1.0.0'
config-version: 2

profile: 'dbt_healthcare_analytics'

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Model configurations
models:
    staging:
      +materialized: view
      +schema: staging
      
    intermediate:
      +materialized: ephemeral
      
    marts:
      +materialized: table
      +schema: marts
      
      fct_claims:
        +materialized: incremental
        +unique_key: claim_id

