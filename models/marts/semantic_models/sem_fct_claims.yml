semantic_models:
- name: fct_claims
  description: Claims fact table at the claim level. This table contains one row per
    claim and includes various financial and status details.
  model: ref('fct_claims')
  defaults:
    agg_time_dimension: service_date
  entities:
  - name: claim
    type: primary
    expr: CLAIM_ID
  - name: member
    type: foreign
    expr: MEMBER_KEY
  - name: provider
    type: foreign
    expr: PROVIDER_KEY
  dimensions:
  - name: type
    expr: claim_type
    type: categorical
  - name: diagnosis_code
    type: categorical
  - name: procedure_code
    type: categorical
  - name: status
    expr: claim_status
    type: categorical
  - name: service_date
    type: time
    type_params:
      time_granularity: day
  - name: submitted_date
    type: time
    type_params:
      time_granularity: day
  - name: service_month
    type: time
    type_params:
      time_granularity: month
  - name: service_year
    type: time
    type_params:
      time_granularity: year
  - name: is_denied
    type: categorical
  - name: is_paid
    type: categorical
  - name: is_late_arrival
    type: categorical
  - name: is_orphan_member
    type: categorical
  - name: is_orphan_provider
    type: categorical
  measures:
  - name: billed_amount
    description: The total billed amount for the claim.
    agg: sum
    create_metric: true
  - name: allowed_amount
    description: The total allowed amount for the claim.
    agg: sum
    create_metric: true
  - name: paid_amount
    description: The total paid amount for the claim.
    agg: sum
    create_metric: true
  - name: network_discount
    description: The total network discount for the claim.
    agg: sum
    create_metric: true
  - name: member_responsibility
    description: The total member responsibility for the claim.
    agg: sum
    create_metric: true
  - name: paid_percentage
    description: The percentage of the claim that was paid.
    agg: average
    create_metric: true
  - name: paid_amount_if_paid
    description: The paid amount if the claim was paid.
    agg: sum
    create_metric: true
  - name: days_to_submit
    description: The number of days taken to submit the claim.
    agg: average
    create_metric: true
  - name: count_claim
    agg: count
    create_metric: true
    expr: CLAIM_ID
  - name: count_member
    agg: count_distinct
    create_metric: true
    expr: MEMBER_KEY
  - name: count_provider
    agg: count_distinct
    create_metric: true
    expr: PROVIDER_KEY

metrics:
- name: total_billed_amount_by_diagnosis_code
  description: Total billed amount categorized by diagnosis code.
  filter: '{{ Dimension(''diagnosis_code'') }} is not null'
  label: Total Billed Amount by Diagnosis Code
  type: simple
  type_params:
    measure:
      name: billed_amount
